<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STR Quality Check System - Evaluasi Lembar Analisis PPATK</title>
  
  <!-- Tailwind CSS CDN with dark mode class strategy -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0857C3',    /* Pantone 2132 C */
              accent: '#307FE2',     /* Vivid Sky */
              highlight: '#71C5E8',  /* Sky Highlight */
              surface: '#0B2545',
              darkbg: '#0F172A'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <style>
    *, *::before, *::after, html, body, input, select, textarea, button {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(48, 127, 226, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(8, 87, 195, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const API_BASE = window.location.origin;

    // --- Standalone Clean SVG Icons ---
    const IconShield = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    );
    const IconLock = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const IconEye = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const IconEyeOff = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
    );
    const IconUpload = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    );
    const IconCheckCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const IconAlertTriangle = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const IconFileText = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
    );
    const IconDownload = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    );
    const IconMessageSquare = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    );
    const IconUser = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    );
    const IconRefreshCw = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    );
    const IconCheck = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    );
    const IconX = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconLogOut = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );

    const SECTION_METADATA = {
      1: { id: 1, name: '1. Kesesuaian Data Profil', weight: 5.0 },
      2: { id: 2, name: '2. Hasil Analisis (Kelengkapan Struktur 5W2H)', weight: 50.0 },
      3: { id: 3, name: '3. Kelengkapan Dokumen Audit Trail', weight: 10.0 },
      4: { id: 4, name: '4. Kerapian & Format Tata Naskah LHA', weight: 5.0 },
      5: { id: 5, name: '5. Kekuatan Hasil Analisis Kualitatif', weight: 30.0 }
    };

    function App() {
      // Authentication State
      const [token, setToken] = useState(() => localStorage.getItem('aml_qc_auth_token'));
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('aml_qc_auth_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Login Form State
      const [loginUsername, setLoginUsername] = useState('superadmin');
      const [loginPassword, setLoginPassword] = useState('password');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Theme & Toast
      const [darkMode, setDarkMode] = useState(false);
      const [toast, setToast] = useState(null);

      // Data States
      const [documents, setDocuments] = useState([]);
      const [selectedDocId, setSelectedDocId] = useState(null);
      const [docDetail, setDocDetail] = useState(null);
      const [isLoadingDetail, setIsLoadingDetail] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadProgressText, setUploadProgressText] = useState('');

      // Admin Action States
      const [newComment, setNewComment] = useState('');
      const [commentSection, setCommentSection] = useState('');
      const [isSubmittingComment, setIsSubmittingComment] = useState(false);
      const [approvalModalOpen, setApprovalModalOpen] = useState(false);
      const [approvalDecision, setApprovalDecision] = useState('APPROVED');
      const [approvalNotes, setApprovalNotes] = useState('');
      const [isSubmittingApproval, setIsSubmittingApproval] = useState(false);
      const [filterSection, setFilterSection] = useState('all');

      const fileInputRef = useRef(null);

      // Toast notification helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Theme toggle effect
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Check auth status on mount
      useEffect(() => {
        if (token) {
          fetch(`${API_BASE}/api/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
            .then(res => res.json())
            .then(data => {
              if (!data.success) {
                handleLogout();
              } else {
                setCurrentUser(data.user);
              }
            })
            .catch(() => handleLogout());
        }
      }, [token]);

      // Handle Login Submit
      const handleLogin = async (e) => {
        if (e) e.preventDefault();
        setLoginError('');

        if (!loginUsername.trim() || !loginPassword.trim()) {
          setLoginError('Username dan kata sandi wajib diisi');
          return;
        }

        setIsLoggingIn(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: loginUsername.trim(),
              password: loginPassword
            })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.message || 'Login gagal. Periksa kembali username dan password.');
          }

          localStorage.setItem('aml_qc_auth_token', data.token);
          localStorage.setItem('aml_qc_auth_user', JSON.stringify(data.user));
          setToken(data.token);
          setCurrentUser(data.user);
          showToast(`Selamat datang kembali, ${data.user.full_name}!`);
          fetchDocuments();
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setIsLoggingIn(false);
        }
      };

      // Handle Logout
      const handleLogout = () => {
        localStorage.removeItem('aml_qc_auth_token');
        localStorage.removeItem('aml_qc_auth_user');
        setToken(null);
        setCurrentUser(null);
        setDocuments([]);
        setDocDetail(null);
        setSelectedDocId(null);
        showToast('Anda telah keluar dari sistem.');
      };

      // Auto-fill default credentials
      const fillDefaultCredentials = () => {
        setLoginUsername('superadmin');
        setLoginPassword('password');
        setLoginError('');
      };

      // Fetch documents list
      const fetchDocuments = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/documents`);
          if (res.ok) {
            const data = await res.json();
            setDocuments(data.documents || []);
            if (!selectedDocId && data.documents && data.documents.length > 0) {
              setSelectedDocId(data.documents[0].id);
            }
          }
        } catch (err) {
          console.error('Gagal mengambil daftar dokumen:', err);
        }
      };

      // Fetch single document detail
      const fetchDocDetail = async (id) => {
        if (!id) return;
        setIsLoadingDetail(true);
        try {
          const res = await fetch(`${API_BASE}/api/documents/${id}`);
          if (res.ok) {
            const data = await res.json();
            setDocDetail(data);
          } else {
            showToast('Gagal memuat rincian dokumen', 'error');
          }
        } catch (err) {
          console.error('Error fetching detail:', err);
          showToast('Koneksi ke API Gateway terputus', 'error');
        } finally {
          setIsLoadingDetail(false);
        }
      };

      useEffect(() => {
        if (token && currentUser) {
          fetchDocuments();
        }
      }, [token, currentUser]);

      useEffect(() => {
        if (selectedDocId && token) {
          fetchDocDetail(selectedDocId);
        }
      }, [selectedDocId]);

      // Handle File Upload
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setIsUploading(true);
        setUploadProgressText('Mengirimkan berkas ke Document Service...');

        try {
          const formData = new FormData();
          formData.append('file', file);

          setUploadProgressText('Mengekstrak teks & tabel menggunakan Mammoth...');
          const res = await fetch(`${API_BASE}/api/documents/upload`, {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || 'Gagal mengunggah berkas');
          }

          const data = await res.json();
          showToast(`Dokumen "${file.name}" berhasil dianalisis!`, 'success');
          
          await fetchDocuments();
          if (data.document?.id) {
            setSelectedDocId(data.document.id);
          }
        } catch (err) {
          console.error('Upload error:', err);
          showToast(`Gagal: ${err.message}`, 'error');
        } finally {
          setIsUploading(false);
          setUploadProgressText('');
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      // Add Admin Comment
      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!newComment.trim() || !selectedDocId) return;

        setIsSubmittingComment(true);
        try {
          const res = await fetch(`${API_BASE}/api/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              document_id: selectedDocId,
              admin_id: currentUser?.id || 3,
              admin_name: currentUser?.full_name || 'Super Administrator AML',
              section_id: commentSection ? parseInt(commentSection, 10) : null,
              comment_text: newComment.trim()
            })
          });

          if (!res.ok) throw new Error('Gagal menyimpan komentar');
          showToast('Komentar penelaahan berhasil ditambahkan');
          setNewComment('');
          fetchDocDetail(selectedDocId);
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setIsSubmittingComment(false);
        }
      };

      // Submit Approval Decision
      const handleSubmitApproval = async () => {
        if (!selectedDocId) return;
        setIsSubmittingApproval(true);

        try {
          const res = await fetch(`${API_BASE}/api/approval`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              document_id: selectedDocId,
              admin_id: currentUser?.id || 3,
              admin_name: currentUser?.full_name || 'Super Administrator AML',
              status: approvalDecision,
              decision_notes: approvalNotes.trim() || (approvalDecision === 'APPROVED' ? 'Disetujui untuk pelaporan PPATK.' : 'Perlu penyesuaian.')
            })
          });

          if (!res.ok) throw new Error('Gagal menyimpan keputusan approval');
          showToast(`Status dokumen berhasil diperbarui: ${approvalDecision}`);
          setApprovalModalOpen(false);
          setApprovalNotes('');
          await fetchDocuments();
          await fetchDocDetail(selectedDocId);
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setIsSubmittingApproval(false);
        }
      };

      // Handle Score Override (1, 2, 3, 4) with optimistic updates and server persistence
      const handleScoreOverride = async (item, newScore) => {
        if (!selectedDocId) return;
        const numericScore = parseFloat(newScore);
        const prevScore = parseFloat(item.score);
        if (numericScore === prevScore) return;

        // 1. Optimistic UI update for immediate instant feedback
        setDocDetail(prev => {
          if (!prev || !prev.evaluation_items) return prev;

          const updatedItems = prev.evaluation_items.map(it => {
            if (it.id === item.id || it.item_id === item.item_id) {
              const isFlagged = numericScore < 3.0;
              return {
                ...it,
                score: numericScore,
                is_flagged: isFlagged,
                comment: isFlagged 
                  ? `Skor disunting penelaah (${numericScore.toFixed(1)}). Parameter dinilai perlu perhatian.` 
                  : `Skor disesuaikan penelaah (${numericScore.toFixed(1)}). Parameter telah diverifikasi valid.`
              };
            }
            return it;
          });

          // Recalculate totals
          let totalWeightedScore = 0;
          let totalWeight = 0;
          let flaggedCount = 0;

          updatedItems.forEach(i => {
            const s = Number(i.score);
            const w = Number(i.weight);
            totalWeightedScore += (w / 100) * s;
            totalWeight += w;
            if (i.is_flagged || s < 3.0) flaggedCount++;
          });

          const newFinalScore = parseFloat(totalWeightedScore.toFixed(2));
          let newCategory = 'TIDAK BAIK (TB)';
          if (newFinalScore >= 3.51) newCategory = 'SANGAT BAIK (SB)';
          else if (newFinalScore >= 2.76) newCategory = 'BAIK (B)';
          else if (newFinalScore >= 2.00) newCategory = 'CUKUP BAIK (CB)';

          const newSectionSummaries = [1, 2, 3, 4, 5].map(secId => {
            const secItems = updatedItems.filter(i => i.section_id === secId);
            const secTotalWeight = secItems.reduce((acc, curr) => acc + Number(curr.weight), 0);
            const secAchievedScore = secItems.reduce((acc, curr) => acc + ((Number(curr.weight) / 100) * Number(curr.score)), 0);
            const secMaxPossible = (secTotalWeight / 100) * 4.0;
            const secPercentage = secMaxPossible > 0 ? (secAchievedScore / secMaxPossible) * 100 : 0;

            return {
              sectionId: secId,
              sectionName: secItems[0]?.section_name || `Seksi ${secId}`,
              secTotalWeight: parseFloat(secTotalWeight.toFixed(2)),
              secAchievedScore: parseFloat(secAchievedScore.toFixed(2)),
              secMaxPossible: parseFloat(secMaxPossible.toFixed(2)),
              secPercentage: parseFloat(secPercentage.toFixed(1))
            };
          });

          const newSummaryJson = {
            totalWeight: parseFloat(totalWeight.toFixed(2)),
            finalScore: newFinalScore,
            category: newCategory,
            flaggedCount,
            sectionSummaries: newSectionSummaries
          };

          return {
            ...prev,
            evaluation: {
              ...prev.evaluation,
              final_score: newFinalScore,
              category: newCategory,
              flagged_count: flaggedCount,
              summary_json: newSummaryJson
            },
            evaluation_items: updatedItems
          };
        });

        // 2. Persist override to QC service backend
        try {
          const res = await fetch(`${API_BASE}/api/qc/override-score`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              document_id: selectedDocId,
              item_id: item.item_id,
              evaluation_item_id: item.id,
              score: numericScore,
              actor_name: currentUser?.full_name || 'Super Administrator AML'
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || 'Gagal menyimpan skor ke server');
          }

          const data = await res.json();
          if (data.evaluation && data.items) {
            setDocDetail(prev => ({
              ...prev,
              evaluation: data.evaluation,
              evaluation_items: data.items
            }));
          }

          // Update document in document list
          setDocuments(prevDocs => prevDocs.map(d => {
            if (d.id === selectedDocId) {
              return {
                ...d,
                final_score: data.evaluation?.final_score,
                category: data.evaluation?.category,
                flagged_count: data.evaluation?.flagged_count
              };
            }
            return d;
          }));

          showToast(`Skor parameter ${item.item_id} diperbarui menjadi ${numericScore}. Skor Akhir: ${data.evaluation?.final_score?.toFixed(2) || numericScore}`, 'success');
        } catch (err) {
          console.error('Error overriding score:', err);
          showToast(`Gagal merubah skor: ${err.message}`, 'error');
          fetchDocDetail(selectedDocId);
        }
      };

      // Calculated stats and filter
      const filteredEvaluationItems = useMemo(() => {
        if (!docDetail?.evaluation_items) return [];
        if (filterSection === 'all') return docDetail.evaluation_items;
        if (filterSection === 'flagged') return docDetail.evaluation_items.filter(i => i.is_flagged || Number(i.score) < 3.0);
        return docDetail.evaluation_items.filter(i => i.section_id === parseInt(filterSection, 10));
      }, [docDetail, filterSection]);

      const evalSummary = docDetail?.evaluation?.summary_json || {};
      const finalScore = Number(docDetail?.evaluation?.final_score || 0);

      // Status badge styling helper
      const getStatusBadge = (status) => {
        const s = status || 'ANALYZED';
        if (s === 'APPROVED') {
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700"><IconCheck className="w-3.5 h-3.5" /> Disetujui</span>;
        }
        if (s === 'REJECTED') {
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-full bg-rose-100 dark:bg-rose-950 text-rose-800 dark:text-rose-300 border border-rose-300 dark:border-rose-700"><IconX className="w-3.5 h-3.5" /> Ditolak</span>;
        }
        if (s === 'RETURN_FOR_REWORK') {
          return <span className="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700"><IconAlertTriangle className="w-3.5 h-3.5" /> Perlu Perbaikan</span>;
        }

                      <IconShield className="w-4 h-4" /> Beri Keputusan Dokumen
                    </button>
                  </div>
                </div>

                {/* 5 Section Summaries Cards */}
                {evalSummary.sectionSummaries && evalSummary.sectionSummaries.length > 0 && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                    {evalSummary.sectionSummaries.map(sec => (
                      <div key={sec.sectionId} className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
                        <div className="text-[11px] font-bold text-slate-400 uppercase truncate" title={sec.sectionName}>
                          {sec.sectionName}
                        </div>
                        <div className="my-2">
                          <div className="flex items-baseline justify-between text-xs font-extrabold text-slate-800 dark:text-slate-100 mb-1">
                            <span>{sec.secPercentage}%</span>
                            <span className="text-[11px] font-normal text-slate-400">Bobot: {sec.secTotalWeight}%</span>
                          </div>
                          <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div
                              className="bg-[#0857C3] dark:bg-[#307FE2] h-full rounded-full transition-all duration-500"
                              style={{ width: `${Math.min(sec.secPercentage, 100)}%` }}
                            ></div>
                          </div>
                        </div>
                        <div className="text-[11px] text-slate-500 dark:text-slate-400">
                          Capaian: {sec.secAchievedScore.toFixed(2)} dari {sec.secMaxPossible.toFixed(2)} poin
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Detailed 22 Criteria Checklist Table with Section Dividers */}
                <div className="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                  <div className="p-4 sm:p-5 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">
                        Rincian Evaluasi 22 Parameter Mutu STR
                      </h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">
                        Hasil evaluasi otomatis oleh mesin. Penelaah/Admin dapat mengklik tombol skor (1 - 4) untuk melakukan penyesuaian manual sebagai mitigasi kesalahan skoring.
                      </p>
                    </div>

                    {/* Section Filter */}
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-slate-500 font-medium">Saring:</span>
                      <select
                        value={filterSection}
                        onChange={(e) => setFilterSection(e.target.value)}
                        className="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-[#307FE2] focus:outline-none"
                      >
                        <option value="all">Semua Seksi (22 Item)</option>
                        <option value="flagged">Perlu Perhatian / Anomali</option>
                        <option value="1">1. Kesesuaian Data Profil (5%)</option>
                        <option value="2">2. Hasil Analisis 5W2H (50%)</option>
                        <option value="3">3. Dokumen Audit Trail (10%)</option>
                        <option value="4">4. Format Tata Naskah LHA (5%)</option>
                        <option value="5">5. Kekuatan Analisis Kualitatif (30%)</option>
                      </select>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 font-semibold border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-3 px-4 w-12 text-center">No.</th>
                          <th className="py-3 px-4 w-52">Parameter Mutu</th>
                          <th className="py-3 px-4">Nilai Ekstraksi Dokumen</th>
                          <th className="py-3 px-4 w-20 text-center">Bobot</th>
                          <th className="py-3 px-4 w-44 text-center">Skor (1 - 4)</th>
                          <th className="py-3 px-4 w-64">Temuan & Catatan Mesin</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {filteredEvaluationItems.map((item, index) => {
                          const isFirstInSection = index === 0 || filteredEvaluationItems[index - 1].section_id !== item.section_id;
                          const secSummary = evalSummary.sectionSummaries?.find(s => s.sectionId === item.section_id);
                          const secMeta = SECTION_METADATA[item.section_id] || { name: `Seksi ${item.section_id}`, weight: 0 };
                          const isAnomalous = Number(item.score) < 3.0 || item.is_flagged;

                          return (
                            <React.Fragment key={item.id || item.item_id}>
                              {isFirstInSection && (
                                <tr className="bg-slate-100/90 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 font-bold border-t-2 border-slate-300 dark:border-slate-700">
                                  <td colSpan={3} className="py-2.5 px-4 uppercase tracking-wider text-xs">
                                    <div className="flex items-center gap-2">
                                      <span className="w-2.5 h-2.5 rounded-full bg-[#0857C3] dark:bg-[#71C5E8] shrink-0"></span>
                                      <span className="font-extrabold text-slate-900 dark:text-white">
                                        {secSummary?.sectionName || secMeta.name}
                                      </span>
                                    </div>
                                  </td>
                                  <td className="py-2.5 px-4 text-center text-xs font-bold text-[#0857C3] dark:text-[#71C5E8]">
                                    {(secSummary?.secTotalWeight || secMeta.weight).toFixed(1)}%
                                  </td>
                                  <td className="py-2.5 px-4 text-center text-xs font-bold text-slate-700 dark:text-slate-200">
                                    {secSummary ? `${secSummary.secPercentage}%` : '-'}
                                  </td>
                                  <td className="py-2.5 px-4 text-xs font-normal text-slate-600 dark:text-slate-400">
                                    <span className="font-semibold text-slate-800 dark:text-slate-200">
                                      Capaian: {secSummary ? secSummary.secAchievedScore.toFixed(2) : '0.00'}
                                    </span>
                                    <span className="text-slate-400 dark:text-slate-500 ml-1">
                                      / {secSummary ? secSummary.secMaxPossible.toFixed(2) : ((secMeta.weight / 100) * 4.0).toFixed(2)} poin maksimal
                                    </span>
                                  </td>
                                </tr>
                              )}

                              <tr className={`hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition ${isAnomalous ? 'bg-amber-50/40 dark:bg-amber-950/20' : ''}`}>
                                <td className="py-3 px-4 font-mono text-center font-bold text-slate-500">{item.item_id}</td>
                                <td className="py-3 px-4 font-semibold text-slate-800 dark:text-slate-200">
                                  {item.item_name}
                                  <div className="text-[11px] font-normal text-slate-500 dark:text-slate-400 mt-0.5">{item.item_desc}</div>
                                </td>
                                <td className="py-3 px-4 text-slate-600 dark:text-slate-300">
                                  <span className="font-mono text-[11px] bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded inline-block max-w-xs truncate" title={item.extracted_value}>
                                    {item.extracted_value || '-'}
                                  </span>
                                </td>
                                <td className="py-3 px-4 text-center text-slate-500 font-medium">{Number(item.weight).toFixed(2)}%</td>
                                <td className="py-3 px-4 text-center">
                                  <div className="inline-flex flex-col items-center gap-1.5">
                                    <div className="flex items-center gap-1">
                                      <span className={`inline-block px-2 py-0.5 rounded font-black text-xs ${
                                        Number(item.score) >= 3.5 
                                          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' 
                                          : Number(item.score) >= 3.0 
                                            ? 'bg-blue-100 text-[#0857C3] dark:bg-blue-950 dark:text-blue-300' 
                                            : Number(item.score) >= 2.0
                                              ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                                              : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300'
                                      }`}>
                                        {Number(item.score).toFixed(1)}
                                      </span>
                                      <span className="text-[10px] text-slate-400 font-semibold">/ 4</span>
                                    </div>

                                    {/* Tombol Interaktif Ubah Skor 1, 2, 3, 4 */}
                                    <div className="inline-flex items-center bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-inner" role="group" aria-label={`Pilih skor untuk ${item.item_id}`}>
                                      {[1, 2, 3, 4].map(sVal => {
                                        const isCurrent = Math.round(Number(item.score)) === sVal;
                                        return (
                                          <button
                                            key={sVal}
                                            type="button"
                                            title={`Ubah skor menjadi ${sVal}${isCurrent ? ' (Skor saat ini)' : ''}`}
                                            onClick={() => handleScoreOverride(item, sVal)}
                                            className={`w-6 h-6 rounded text-xs font-bold transition-all flex items-center justify-center ${
                                              isCurrent
                                                ? sVal === 4
                                                  ? 'bg-emerald-600 text-white shadow-sm ring-1 ring-emerald-400 scale-105'
                                                  : sVal === 3
                                                    ? 'bg-[#0857C3] text-white shadow-sm ring-1 ring-blue-400 scale-105'
                                                    : sVal === 2
                                                      ? 'bg-amber-500 text-white shadow-sm ring-1 ring-amber-400 scale-105'
                                                      : 'bg-rose-600 text-white shadow-sm ring-1 ring-rose-400 scale-105'
                                                : 'text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white'
                                            }`}
                                          >
                                            {sVal}
                                          </button>
                                        );
                                      })}
                                    </div>
                                  </div>
                                </td>
                                <td className="py-3 px-4 text-slate-600 dark:text-slate-400">
                                  {item.is_flagged && (
                                    <span className="inline-block mr-1.5 text-rose-500 font-bold" title="Perlu perhatian khusus">⚠️</span>
                                  )}
                                  <span>{item.comment}</span>
                                </td>
                              </tr>
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Admin Comments & Review Feedback Section */}
                <div className="bg-white dark:bg-slate-900 p-5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <IconMessageSquare className="w-5 h-5 text-[#0857C3] dark:text-[#71C5E8]" />
                      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-white">
                        Catatan Penelaahan ({docDetail.comments?.length || 0})
                      </h3>
                    </div>
                  </div>

                  {/* List of existing comments */}
                  <div className="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                    {(!docDetail.comments || docDetail.comments.length === 0) ? (
                      <p className="text-xs text-slate-400 italic py-2">Belum ada catatan penelaahan untuk dokumen ini.</p>
                    ) : (
                      docDetail.comments.map(c => (
                        <div key={c.id} className="p-3 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs">
                          <div className="flex items-center justify-between mb-1 text-slate-500">
                            <span className="font-bold text-slate-700 dark:text-slate-300">{c.admin_name}</span>
                            <span>{new Date(c.created_at).toLocaleString('id-ID')}</span>
                          </div>
                          <p className="text-slate-800 dark:text-slate-200 leading-relaxed">{c.comment_text}</p>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Add Comment Input Form */}
                  <form onSubmit={handleAddComment} className="pt-2 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={newComment}
                      onChange={(e) => setNewComment(e.target.value)}
                      placeholder="Tulis arahan perbaikan atau catatan kepatuhan untuk analis..."
                      className="flex-1 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#307FE2]"
                      disabled={isSubmittingComment}
                    />
                    <button
                      type="submit"
                      disabled={isSubmittingComment || !newComment.trim()}
                      className="px-4 py-2 text-xs font-bold rounded-lg bg-[#0857C3] hover:bg-blue-700 text-white disabled:opacity-50 transition shadow-sm"
                    >
                      {isSubmittingComment ? 'Menyimpan...' : 'Kirim Catatan'}
                    </button>
                  </form>
                </div>

              </div>
            )}
          </main>

          {/* Approval & Rejection Modal Dialog */}
          {approvalModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" role="dialog" aria-modal="true">
              <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <div className="flex items-center gap-2 text-[#0857C3] dark:text-[#71C5E8]">
                    <IconShield className="w-5 h-5" />
                    <h3 className="text-base font-bold text-slate-900 dark:text-white">
                      Keputusan Evaluasi Dokumen STR
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setApprovalModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <IconX className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Pilih Keputusan:
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        type="button"
                        onClick={() => setApprovalDecision('APPROVED')}
                        className={`p-2.5 rounded-lg border text-center font-bold transition ${
                          approvalDecision === 'APPROVED' 
                            ? 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-500 text-emerald-700 dark:text-emerald-300' 
                            : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                        }`}
                      >
                        Setujui
                      </button>
                      <button
                        type="button"
                        onClick={() => setApprovalDecision('RETURN_FOR_REWORK')}
                        className={`p-2.5 rounded-lg border text-center font-bold transition ${
                          approvalDecision === 'RETURN_FOR_REWORK' 
                            ? 'bg-amber-50 dark:bg-amber-950/60 border-amber-500 text-amber-700 dark:text-amber-300' 
                            : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                        }`}
                      >
                        Minta Perbaikan
                      </button>
                      <button
                        type="button"
                        onClick={() => setApprovalDecision('REJECTED')}
                        className={`p-2.5 rounded-lg border text-center font-bold transition ${
                          approvalDecision === 'REJECTED' 
                            ? 'bg-rose-50 dark:bg-rose-950/60 border-rose-500 text-rose-700 dark:text-rose-300' 
                            : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                        }`}
                      >
                        Tolak
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Catatan Pertimbangan atau Arahan:
                    </label>
                    <textarea
                      rows="3"
                      value={approvalNotes}
                      onChange={(e) => setApprovalNotes(e.target.value)}
                      placeholder="Tuliskan pertimbangan persetujuan, perbaikan yang diperlukan, atau dasar penolakan..."
                      className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-[#307FE2]"
                    ></textarea>
                  </div>

                  <p className="text-[11px] text-slate-400">
                    Keputusan ini akan dicatat dalam riwayat evaluasi dan dibubuhkan sebagai stempel digital pada berkas PDF resmi.
                  </p>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                  <button
                    type="button"
                    onClick={() => setApprovalModalOpen(false)}
                    className="px-4 py-2 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    Batal
                  </button>
                  <button
                    type="button"
                    onClick={handleSubmitApproval}
                    disabled={isSubmittingApproval}
                    className="px-5 py-2 text-xs font-bold rounded-lg bg-[#0857C3] hover:bg-blue-700 text-white shadow-sm disabled:opacity-50"
                  >
                    {isSubmittingApproval ? 'Membubuhkan Stempel...' : 'Simpan Keputusan'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-4 px-8 text-center text-xs text-slate-400">
            STR Quality Check System - Laporan Transaksi Keuangan Mencurigakan (STR PPATK)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
