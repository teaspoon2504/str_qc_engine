        scores,
        findings,
        stats: {
          totalItems: Object.keys(extracted).length,
          placeholderCount,
          completedCount: Object.keys(extracted).length - placeholderCount,
          isTemplate: placeholderCount > 5
        }
      };

      setIsParsingDoc(false);
      applyParsedDocResult(parsedResult);
    } catch (err) {
      console.error('Client-side docx parsing error:', err);
      setIsParsingDoc(false);
      showToast(`Peringatan: Gagal membedah DOCX di browser (${err.message}). Memuat nama file.`);
      setItems(prev => prev.map(item => item.id === '3.4' ? { ...item, value: file.name } : item));
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploadedDocName(file.name);

    if (file.name.toLowerCase().endsWith('.docx')) {
      showToast(`⚙️ Memproses dokumen STR "${file.name}" dengan Mesin QC Otomatis...`);
      parseDocxClientSide(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const text = event.target?.result;
        if (file.name.endsWith('.json') && typeof text === 'string') {
          const parsed = JSON.parse(text);
          if (parsed.items && Array.isArray(parsed.items)) {
            setItems(prev => prev.map(item => {
              const matched = parsed.items.find((pi) => pi.id === item.id || pi.item === item.item);
              return matched ? { ...item, value: matched.value || item.value } : item;
            }));
          }
          if (parsed.metadata) {
            setMetadata(prev => ({ ...prev, ...parsed.metadata }));
          }
          showToast(`Data dokumen STR "${file.name}" berhasil diekstrak ke kolom Value!`);
          return;
        }

        if (typeof text === 'string') {
          const cifMatch = text.match(/CIF[:\s]+([A-Za-z0-9-]+)/i);
          const nameMatch = text.match(/(?:Nama|Customer|Nasabah)[:\s]+([^\n\r,]+)/i);
          const accMatch = text.match(/(?:Rekening|Account)[:\s]+([0-9-]+)/i);
          const nominalMatch = text.match(/(?:Nominal|Total|Nilai)[:\s]+(Rp[^\n\r]+|[0-9.,]+)/i);

          if (cifMatch) setMetadata(prev => ({ ...prev, cif: cifMatch[1].trim() }));
          if (nameMatch) setMetadata(prev => ({ ...prev, customerName: nameMatch[1].trim() }));
          
          setItems(prev => prev.map(item => {
            if (item.id === '1.1' && nameMatch) return { ...item, value: nameMatch[1].trim() };
            if (item.id === '1.2' && cifMatch) return { ...item, value: cifMatch[1].trim() };
            if (item.id === '1.5' && accMatch) return { ...item, value: accMatch[1].trim() };
            if (item.id === '1.6' && nominalMatch) return { ...item, value: nominalMatch[1].trim() };
            if (item.id === '3.4') return { ...item, value: file.name };
            return item;
          }));
        }
        showToast(`📄 Dokumen STR "${file.name}" berhasil diunggah! Nilai data diekstrak ke kolom Value.`);
      } catch (err) {
        showToast(`Dokumen "${file.name}" dimuat sebagai referensi.`);
      }
    };

    if (file.name.endsWith('.json') || file.name.endsWith('.txt') || file.name.endsWith('.csv')) {
      reader.readAsText(file);
    } else {
      reader.readAsArrayBuffer(file);
      setItems(prev => prev.map(item => item.id === '3.4' ? { ...item, value: file.name } : item));
      showToast(`📄 Dokumen STR "${file.name}" berhasil diunggah! Nilai data diekstrak ke kolom Value.`);
    }
  };

  const handleScoreChange = (id, newScore) => {
    const numericScore = Math.max(0, Math.min(4, parseFloat(newScore) || 0));
    setItems(prev => prev.map(item => item.id === id ? { ...item, score: numericScore } : item));
  };

  const handleCommentChange = (id, newComment) => {
    setItems(prev => prev.map(item => item.id === id ? { ...item, comment: newComment } : item));

  const handleMetadataChange = (e) => {
    const { name, value } = e.target;
    setMetadata(prev => ({ ...prev, [name]: value }));

  const applyPreset = (type) => {
    if (type === 'perfect') {
      setItems(prev => prev.map(item => ({ ...item, score: 4.0 })));

      setItems(prev => prev.map((item, idx) => ({ ...item, score: idx % 4 === 0 ? 3.5 : 3.8 })));
      showToast('Preset applied: Good Quality (3.5+)');

      setItems(prev => prev.map(item => ({ ...item, score: item.sectionId === 5 || item.sectionId === 2 ? 1.8 : 2.5 })));
      showToast('Preset applied: Low Quality (< 2.5)');

      showToast('Reset all data to default standards.');

  };

  const handleSaveReport = () => {

      finalScore: calculatedData.finalScore,
      category: calculatedData.category,
      categoryBadgeClass: calculatedData.categoryBadgeClass,
      flaggedCount: calculatedData.flaggedCount,
      itemsSnapshot: items.map(i => ({ id: i.id, score: i.score, comment: i.comment, weight: i.weight, item: i.item, sectionName: i.sectionName, value: i.value }))

    setSavedReports(prev => [newReport, ...prev]);
    showToast(`✅ QC Report for ${metadata.customerName} saved to Repository!`);
  };

  const handleLoadReport = (report) => {

        return snap ? { ...item, score: snap.score, comment: snap.comment, value: snap.value !== undefined ? snap.value : item.value } : item;
      }));
    }
    setActiveTab('excel');
    showToast(`📂 Loaded QC Report: ${report.metadata.strReference || report.id}`);
  };

  const handleDeleteReport = (id) => {

  const filteredItems = useMemo(() => {
    return calculatedData.items.filter(item => {

  const handleExportCSV = () => {

OVERALL QC REMARKS:
"${overallRemarks}"
================================================`;

      {/* Toast Notification */}

          {toastMsg}

      {/* Top Header Navigation - Pantone PMS 2132 C (#0857C3) */}

              <FileSpreadsheet className="w-6 h-6" />

                              <div><span className="text-slate-400">QC:</span> {report.metadata.reviewerName}</div>
                            </td>
                            <td className="py-3 px-3 text-center ">
                              <div className="font-black text-sm text-slate-900 dark:text-white">{report.finalScore.toFixed(2)} / 4.00</div>
                              <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded border mt-0.5 ${report.categoryBadgeClass}`}>
                                {report.category}
                              </span>
                            </td>
                            <td className="py-3 px-3 text-center">
                              <span className={`inline-block text-[11px] font-extrabold px-2.5 py-1 rounded-full border ${
 report.metadata.decision === 'Approve & File STR'
 ? 'bg-[#71C5E8]/20 text-[#0857C3] border-[#307FE2] dark:bg-[#0857C3]/30 dark:text-[#71C5E8]'
 : report.metadata.decision === 'Return for Rework'
 ? 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950 dark:text-amber-300'
 : 'bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-950 dark:text-rose-300'
 }`}>
                                {report.metadata.decision}
                              </span>
                            </td>
                            <td className="py-3 px-3 text-center">
                              <div className="flex items-center justify-center space-x-1.5">
                                <button
                                  onClick={() => handleLoadReport(report)}
                                  className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded text-[11px] font-medium transition"
                                  title="Load this report into evaluation grid"
                                >
                                  👁️ Load
                                </button>
                                <button
                                  onClick={() => handleDeleteReport(report.id)}
                                  className="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300 border border-rose-200 dark:border-rose-800 rounded text-[11px] font-medium transition"
                                  title="Delete from history"
                                >
                                  <Trash2 className="w-3 h-3" />
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}

        {}
        {activeTab === 'analytics' && (
          <div className="space-y-6">
            <div className="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
              <div>
                <h2 className="text-base font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                  <BarChart3 className="w-5 h-5 text-[#0857C3]" />
                  <span>QC Section Weighted Performance Analytics</span>
                </h2>
                <p className="text-xs text-slate-500 mt-1">
                  Detailed breakdown across the 5 core STR evaluation dimensions
                </p>
              </div>

              <div className="space-y-4">
                {calculatedData.sectionSummaries.map((sec) => (
                  <div key={sec.sectionId} className="space-y-1.5 bg-slate-50 dark:bg-slate-800/40 p-4 rounded-lg border border-slate-200 dark:border-slate-700">
                    <div className="flex justify-between items-center text-xs font-semibold">
                      <span className="text-slate-800 dark:text-slate-200">{sec.sectionName}</span>
                      <div className="space-x-2 ">
                        <span className="text-[#0857C3] dark:text-[#71C5E8] font-bold">
                          {sec.secAchievedScore.toFixed(2)} / {sec.secMaxPossible.toFixed(2)} pts
                        </span>
                        <span className="text-slate-400">({sec.secPercentage.toFixed(1)}%)</span>
                      </div>
                    </div>

                    <div className="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${
 sec.secPercentage >= 87.5 ? 'bg-[#0857C3]' : sec.secPercentage >= 70 ? 'bg-[#307FE2]' : sec.secPercentage >= 50 ? 'bg-amber-500' : 'bg-rose-500'
 }`}
                        style={{ width: `${Math.min(100, sec.secPercentage)}%` }}
                      />
                    </div>

                    <div className="flex justify-between text-[10px] text-slate-400 ">
                      <span>Allocated Section Weight: {sec.secTotalWeight}%</span>
                      <span>Target: 4.0 Scale</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {}
        {activeTab === 'feedback' && (
          <div className="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6 text-slate-700 dark:text-slate-300">
            <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
              <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                <ShieldCheck className="w-5 h-5 text-[#0857C3]" />
                <span>Senior AML Analyst Audit & Review Assessment</span>
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                Evaluation of the STR Quality Control Checklist against PPATK Regulatory Standards and FATF Best Practices.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
              <div className="bg-[#71C5E8]/10 dark:bg-[#0857C3]/20 p-4 rounded-lg border border-[#307FE2]/30 space-y-3">
                <h3 className="font-bold text-[#0857C3] dark:text-[#71C5E8] flex items-center space-x-2">
                  <CheckCircle2 className="w-4 h-4 text-[#0857C3]" />
                  <span>Key Methodological Strengths</span>
                </h3>
                <ul className="list-disc list-inside space-y-2 text-xs text-slate-700 dark:text-slate-300">
                  <li><strong>Core Priority Focus:</strong> Assigning 80% combined weight to Analysis Structure (50%) and Qualitative Strength (30%) correctly prioritizes core analytical quality over administrative formatting.</li>
                  <li><strong>Standardized Framework:</strong> Explicit inclusion of 5W2H (Who, What, Where, When, Why, How, How Much) ensures structural compliance.</li>
                  <li><strong>Visual & Data Audit Trail:</strong> Mandatory checks for cash flow diagrams and transaction tables improve auditability.</li>
                </ul>
              </div>

              <div className="bg-amber-50/50 dark:bg-amber-950/20 p-4 rounded-lg border border-amber-200 dark:border-amber-800 space-y-3">
                <h3 className="font-bold text-amber-800 dark:text-amber-300 flex items-center space-x-2">
                  <AlertTriangle className="w-4 h-4 text-amber-600" />
                  <span>Identified Operational Gaps & Enhancements</span>
                </h3>
                <ul className="list-disc list-inside space-y-2 text-xs text-slate-700 dark:text-slate-300">
                  <li><strong>Unweighted Sub-items Fixed:</strong> Sub-items now have explicit individual mathematical weights summing up to section totals.</li>
                  <li><strong>Shift to Typology Mapping:</strong> Replaced verbatim law quotes with assessment of ML/TF typologies (e.g., structuring, pass-through, trade-based ML).</li>
                  <li><strong>Inclusion of Timeliness SLA:</strong> Added strict tracking for reporting SLA limits to prevent regulatory dispatch delays.</li>
                </ul>
              </div>
            </div>
          </div>
        )}

        {}
        {activeTab === 'rubric' && (
          <div className="bg-white dark:bg-slate-900 rounded-xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
            <div className="border-b border-slate-200 dark:border-slate-800 pb-4">
              <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                <Award className="w-5 h-5 text-[#0857C3]" />
                <span>QC Implementation Category & Rating Scales</span>
              </h2>
              <p className="text-xs text-slate-500 mt-1">Official evaluation bands for AML STR Quality Assessment</p>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left border border-slate-200 dark:border-slate-800">
                <thead className="bg-[#0857C3] text-white uppercase">
                  <tr>
                    <th className="py-2.5 px-4 border-r border-[#307FE2]">Category Name</th>
                    <th className="py-2.5 px-4 border-r border-[#307FE2] text-center">Score Range</th>
                    <th className="py-2.5 px-4">Quality & Operational Standard</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 dark:divide-slate-800 font-sans">
                  <tr className="bg-[#71C5E8]/10 dark:bg-[#0857C3]/20">
                    <td className="py-3 px-4 font-bold text-[#0857C3] dark:text-[#71C5E8] border-r border-slate-200 dark:border-slate-800">
                      SANGAT BAIK (SB)
                    </td>
                    <td className="py-3 px-4 font-bold text-center border-r border-slate-200 dark:border-slate-800">
                      3.51 – 4.00
                    </td>
                    <td className="py-3 px-4 text-slate-600 dark:text-slate-300">
                      Fully compliant. Comprehensive profiling, flawless fund flow tracing, watertight analytical logic, clear predicate crime alignment, and ready for immediate regulatory dispatch to PPATK.
                    </td>
                  </tr>
                  <tr className="bg-blue-50/50 dark:bg-blue-950/20">
                    <td className="py-3 px-4 font-bold text-blue-800 dark:text-blue-300 border-r border-slate-200 dark:border-slate-800">
                      BAIK (B)
                    </td>
                    <td className="py-3 px-4 font-bold text-center border-r border-slate-200 dark:border-slate-800">
                      2.76 – &lt; 3.50
                    </td>
                    <td className="py-3 px-4 text-slate-600 dark:text-slate-300">
                      Satisfactory quality. Suspicion is adequately justified, all required structure items present, but minor background profiling or non-critical formatting gaps exist.
                    </td>
                  </tr>
                  <tr className="bg-amber-50/50 dark:bg-amber-950/20">
                    <td className="py-3 px-4 font-bold text-amber-800 dark:text-amber-300 border-r border-slate-200 dark:border-slate-800">
                      CUKUP BAIK (CB)
                    </td>
                    <td className="py-3 px-4 font-bold text-center border-r border-slate-200 dark:border-slate-800">
                      2.00 – &lt; 2.75
                    </td>
                    <td className="py-3 px-4 text-slate-600 dark:text-slate-300">
                      Needs improvement. Weak narrative rationale, incomplete transaction breakdown, or missing critical external/internal profile checks. Requires analyst re-work before filing.
                    </td>
                  </tr>
                  <tr className="bg-rose-50/50 dark:bg-rose-950/20">
                    <td className="py-3 px-4 font-bold text-rose-800 dark:text-rose-300 border-r border-slate-200 dark:border-slate-800">
                      TIDAK BAIK (TB)
                    </td>
                    <td className="py-3 px-4 font-bold text-center border-r border-slate-200 dark:border-slate-800">
                      0.00 – &lt; 2.00
                    </td>
                    <td className="py-3 px-4 text-slate-600 dark:text-slate-300">
                      Unsatisfactory. Missing vital 5W2H components, contradictory logic, failure to establish reasonable grounds for suspicion, or major data inaccuracies. Rejected.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        )}

      </main>
    </div>
  );
}

    // --- Render Application to DOM ---
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
